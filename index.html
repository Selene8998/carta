<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Choo-Choo-Choose You</title>
    <style>
        body {
            background-color: #a2d2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 90%;
            width: 400px;
        }
        img {
            max-width: 100%;
            border-radius: 10px;
        }
        h1 {
            color: #ff4d6d;
            font-size: 24px;
        }
        p {
            color: #555;
            line-height: 1.5;
        }
        .heart {
            color: #ff4d6d;
            font-size: 30px;
            animation: beat .25s infinite alternate;
            transform-origin: center;
            display: inline-block;
        }
        @keyframes beat{
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="image.png" alt="I Choo-Choo-Choose You">
        <h1>¡Te elijo a vos!</h1>
        <p>No necesito SQL para saber que eres el registro más importante de mi base de datos.</p>
        <div class="heart">❤️</div>
    </div>

</body>
</html>
