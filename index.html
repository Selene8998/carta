<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Choo-Choo-Choose You - Interactivo</title>
    <style>
        body {
            background-color: #a2d2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 85%;
            width: 380px;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
            z-index: 1; /* La tarjeta queda en la capa base */
        }
        .card:active {
            transform: scale(0.95);
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            /* No necesita z-index aquí para que los corazones pasen arriba */
        }
        h1 {
            color: #ff4d6d;
            font-size: 22px;
            margin: 10px 0;
        }
        p {
            color: #333;
            line-height: 1.6;
            font-size: 14px;
        }
        /* ESTILO DE LOS CORAZONES - CAPA SUPERIOR */
        .heart-particle {
            position: absolute;
            color: #ff4d6d;
            font-size: 25px;
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 9999; /* Esto los pone por delante de TODO */
        }
        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="card" id="loveCard">
        <!-- Usando el nombre que te funcionó -->
        <img src="IMG_5949.jpeg" alt="I Choo-Choo-Choose You">
        <h1>¡Select * From My_Heart!</h1>
        <p>Eres el único registro en mi tabla <code>true_love</code>. <br> ¡Toca aquí para procesar!</p>
    </div>

    <script>
        const card = document.getElementById('loveCard');

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerHTML = '❤️';
            
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.top = "-10vh";
            heart.style.fontSize = Math.random() * 20 + 20 + "px";
            heart.style.animationDuration = Math.random() * 3 + 2 + "s";
            heart.style.opacity = Math.random() * 0.5 + 0.5;

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        // Al tocar la tarjeta llueven muchos corazones
        card.addEventListener('click', () => {
            for (let i = 0; i < 20; i++) {
                setTimeout(createHeart, i * 50); 
            }
        });
        
        // Corazones constantes de fondo
        setInterval(createHeart, 600);
    </script>

</body>
</html>
